# motir-marketing CI — MOTIR-1455.
#
# This MIRRORS motir-core's `ci.yml` rather than copying it: that file declares
# `needs: [lint, typecheck, build, test, coverage, e2e, e2e-at-scale]`, and four
# of those jobs do not exist here. The shape to keep, per
# `motir-core/docs/decisions/marketing-site-hosting.md` Q3, is the deploy job's:
# gate on what exists, deploy only on a push to main, and give the release its
# OWN non-cancelling concurrency group. Add a gate to `needs` below as this
# repository grows one — do not declare a gate before its job exists.
#
# MOTIR-1152 grew the first one: `test` (vitest, `vitest.config.mts`), added
# BELOW and to `deploy`'s `needs` in the same change, exactly as that sentence
# asks. MOTIR-4001 grew the second, `design-guards`, the same way. MOTIR-4112
# grew the third, `e2e` — the browser lane — again in the same change.
# There is still no `coverage` or `e2e-at-scale` job here and `needs` names
# neither.
#
# ⚠️ AND THERE IS NO ACCEPTANCE-VIDEO WORKFLOW, WHICH IS A DECISION RATHER THAN
# A GAP. MOTIR-4112 asked for one mirroring motir-core's; both that workflow and
# its `upload-acceptance-video` composite were DELETED from motir-core on
# 2026-09-02 (MOTIR-4096), whose amendment to `docs/decisions/acceptance-video.md`
# reads "CI NO LONGER UPLOADS THE RECORDING. THE AGENT PUBLISHES IT, over the
# Motir MCP surface" — retiring the uploader, the `id-token: write` grant and the
# `MOTIR_UPLOAD_TOKEN` secret, because "a credential with no consumer is one
# nobody thinks about when deciding whether to rotate it". Mirroring it here
# would re-introduce that credential in a second repository the day after it was
# removed from the first. The `e2e` job RECORDS instead — `video: 'on'`, uploaded
# as an ordinary run artifact — and the agent publishes the clip onto the card.
# `playwright.config.ts` carries the full reasoning.
#
# ⚠️ THERE IS NO PATH FILTERING IN THIS FILE, and `design-guards` depends on
# that. Unlike motir-core's `ci.yml` — which has a `changes` job that skips the
# app lanes on a `design/*` diff, and therefore needs a separate always-on lane
# to carry its design-asset guards — every job here runs on every pull request,
# whatever the branch prefix or the diff. So `design-guards` is already reached
# by the only kind of change that can break it. If path filtering is ever added
# to this file, `design-guards` must be exempt from it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A new `motir-skills` release re-releases the site (MOTIR-8802): every install
  # command on motir.co names the latest release, resolved at BUILD
  # (`scripts/skills/resolve-release.ts`). `motir-skills`' release workflow can
  # send `repository_dispatch` with type `motir-skills-release` for an immediate
  # rebuild; the daily schedule is the backstop that needs nothing from that
  # repository, so the site is never more than a day behind a release.
  repository_dispatch:
    types: [motir-skills-release]
  schedule:
    - cron: '17 5 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # ⚠️ THE BUILD FAILS WITHOUT THIS, BY DESIGN (MOTIR-1152). `lib/appOrigin.ts`
  # throws `MotirAppOriginError` at module scope when the variable is unset,
  # which is what stops a release shipping a landing page whose three doors
  # point at `undefined`. It is set HERE, once, for the `Build` check.
  #
  # It is ALSO what the release uses: `NEXT_PUBLIC_*` is inlined by
  # `next build`, and the `deploy` job below runs `vercel build` on the runner,
  # where this env reaches it. One site, one meaning.
  NEXT_PUBLIC_MOTIR_APP_ORIGIN: 'https://app.motir.co'

  # The tenant namespace's base domain (MOTIR-4220), for the `Build` check —
  # `lib/tenantDomain.ts` fails a PRODUCTION build without it, and `next build`
  # is a production build. The release builds with it too, as above.
  #
  # ⚠️ THE BROWSER LANE DOES NOT INHERIT THIS. `playwright.config.ts` sets it to
  # `localhost` explicitly, because the lane's tenant host is `acme.localhost`
  # and a lane pointed at the production namespace would be testing a base
  # domain none of its hosts belong to.
  NEXT_PUBLIC_MOTIR_TENANT_DOMAIN: 'motir.site'

  # motir-ai's public origin (MOTIR-8382), for /price — the release builds
  # with it too. The browser lane points it at the stub instead.
  NEXT_PUBLIC_MOTIR_AI_ORIGIN: 'https://motir-ai.fly.dev'

jobs:
  lint:
    name: Lint
    # The runner is chosen by the MOTIR_RUNNER org variable, which the /admin fleet switch writes
    # (Story MOTIR-8699); unset means GitHub-hosted. Never hard-code a runner label here again.
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # MOTIR-7967 — every page prerendered in every one of the twelve
      # languages, and no route static before the story turned dynamic. Only
      # the build's own manifests know, so it runs here, after `next build`.
      - run: pnpm i18n:check-prerender

  # ── The unit / component suite (MOTIR-1152) ───────────────────────────────
  #
  # This repository's FIRST test job. It is a `needs` gate on `deploy` from the
  # moment it exists, per the header: a red suite must not reach motir.co.
  #
  # Node environment plus jsdom (`vitest.config.mts`) — there is no database
  # and nothing to seed, so the whole suite is seconds. `tests/appOrigin.test.ts`
  # is the one acceptance criterion that asks to be asserted "with a test, not
  # by inspection".
  test:
    name: Test
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ── The design-asset guard lane (MOTIR-4001) ──────────────────────────────
  #
  # `design/marketing/design-notes.md` § "A design board's CHROME owes AA"
  # (MOTIR-3985, adopting motir-core's MOTIR-3054) was enforced by nothing: the
  # `test` job above runs on jsdom, and jsdom cannot measure a `.mock.html` —
  # it drops the `font:` shorthand and does not apply `background: var(--el-*)`,
  # so every reading falls on the side that UNDER-reports. This lane drives a
  # real headless chromium over the assets instead.
  #
  # It is a `needs` gate on `deploy` from the moment it exists, per the header.
  #
  # The browser is the whole cost of the job, and it is the same devDependency
  # MOTIR-4003's `.png` re-export uses. `--with-deps` installs chromium's shared
  # libraries; `--only-shell` takes the headless shell rather than the full
  # browser, which is all `chromium.launch()` needs here.
  design-guards:
    name: Design guards
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:design

  # ── The BROWSER lane (MOTIR-4112) ─────────────────────────────────────────
  #
  # This repository's first, and a `needs` gate on `deploy` from the moment it
  # exists, per the header: a red browser run must not reach motir.co.
  #
  # ⚠️ IT BUILDS THE APP, and that is not incidental. The site reads the public
  # API from SERVER components, so the stub cannot be a `page.route()`
  # interception — it is a real HTTP server, and pointing the app at it means
  # setting `NEXT_PUBLIC_MOTIR_APP_ORIGIN`, which Next inlines at BUILD time.
  # `playwright.config.ts`'s `webServer` therefore runs `pnpm build` itself, and
  # this job's cost and timeout follow from that. It is a separate job rather
  # than a step inside `test` for the same reason: `test` is seconds, this is
  # minutes, and folding them would make every unit failure wait for a build.
  #
  # ⚠️ NO `motir-core` IS AVAILABLE HERE, which is the whole reason the stub
  # exists. The CONTRACT those fixtures are shaped from is guarded in the
  # PRODUCING repository (`public-surface-hosts.md` §3): a contract test living
  # only in the consumer reports the break after it has shipped.
  #
  # `--only-shell` takes the headless shell, as `design-guards` above does.
  e2e:
    name: E2E
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      # The RECORDING, kept whether the run passed or failed. On a green
      # acceptance run this artifact is where the clip is read from and
      # published onto the card — see the header, and `playwright.config.ts`.
      - name: Upload the Playwright report (recording included)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          # ⚠️ NOT a dot-prefixed path, and the default `include-hidden-files`
          # is false — an upload that matched nothing would still be GREEN.
          if-no-files-found: warn

  # ── The LIVE subprocessor seam, as a RELEASE gate (MOTIR-4139) ────────────
  #
  # `motir-core/docs/decisions/public-surface-hosts.md` AMENDMENT 2 §E requires
  # that the seam FAIL when the two sides diverge. MOTIR-4008 and MOTIR-4011
  # shipped two halves and neither closes it: one proves the manifest describes
  # motir-core's own tree, the other proves the comparison WOULD report a
  # divergence if handed one. This job hands it the real one — the manifest
  # motir-core is actually serving, against the pages this release is about to
  # publish — so the site cannot deploy while it is lying. AMENDMENT 3 records
  # the mechanism and the rejected alternatives.
  #
  # ⚠️ IT IS THE ONE JOB IN THIS FILE THAT DOES NOT RUN ON A PULL REQUEST, and
  # that exception is the whole point rather than an optimisation. It reaches
  # app.motir.co, so running it on `pull_request` would turn unrelated pull
  # requests red whenever motir-core restarts — the cross-repository CI coupling
  # §E's split exists to avoid. Its `if` therefore MIRRORS `deploy`'s exactly;
  # the two are skipped together, which is why gating `deploy` on it is safe.
  #
  # ⚠️ THIS DOES NOT WEAKEN THE HEADER'S NO-PATH-FILTERING NOTE. That note is
  # about `design-guards` being reached by every diff, and it still is. This is
  # an EVENT condition, not a path filter, and it applies to this job alone.
  #
  # The gate only fires when THIS repository deploys. A vendor added in
  # motir-core after our last release is caught by `subprocessor-seam.yml`, the
  # scheduled half — the two cover disjoint sides of §E's two-failure window and
  # neither is sufficient alone.
  subprocessor-seam:
    name: Subprocessor seam (live)
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reads the workflow-level NEXT_PUBLIC_MOTIR_APP_ORIGIN above — the same
      # origin the release itself is built against, which is what makes this a
      # check of the thing being shipped rather than of some other deployment.
      - run: pnpm test:seam

  deploy:
    name: Deploy to Vercel
    runs-on: ${{ vars.MOTIR_RUNNER || 'ubuntu-latest' }}
    needs: [lint, typecheck, build, test, design-guards, e2e, subprocessor-seam]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # A release must NOT be cancelled mid-flight by a newer push — the
    # workflow-level `cancel-in-progress` above is right for a test run and
    # wrong for a deploy, so this group overrides it.
    concurrency:
      group: vercel-deploy-marketing
      cancel-in-progress: false
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # A token for the team that owns the project, and the two ids
      # `vercel link` writes to `.vercel/project.json`. The build runs HERE,
      # on the runner (`vercel build`), and only its output is uploaded
      # (`--prebuilt`): the gates above stay the only thing that decides
      # what ships, and `vercel.json` turns Vercel's Git integration off.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx vercel@58.4.4 pull --yes --environment=production --token "$VERCEL_TOKEN"
      # The workflow-level `NEXT_PUBLIC_*` above are what this build inlines,
      # and `SKILLS_RELEASE_TAG` is resolved the way `pnpm build` resolves it.
      - run: |
          export SKILLS_RELEASE_TAG="$(node scripts/skills/resolve-release.ts)"
          pnpm dlx vercel@58.4.4 build --prod --token "$VERCEL_TOKEN"
      - id: release
        run: |
          url=$(pnpm dlx vercel@58.4.4 deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Prove the release on Vercel's edge, not through DNS: `--resolve` sends
      # motir.co to Vercel's anycast address whatever the apex points at, so
      # this is green before the DNS move and stays honest after. `proxy.ts`
      # serves the site only on motir.co's own host. `--insecure` because the
      # certificate is issued only once the apex points at Vercel: this
      # proves the release answers, not the certificate.
      - name: Smoke the release on Vercel's edge
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 \
            --retry-all-errors --insecure --resolve motir.co:443:76.76.21.21 https://motir.co/)
          echo "GET https://motir.co/ via 76.76.21.21 (${{ steps.release.outputs.url }}) -> $code"
          [ "$code" = "200" ]

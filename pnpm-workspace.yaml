# Not a workspace — this repository is a single package. The file exists because
# pnpm 11 reads its BUILD ALLOWLIST from here, and an install that leaves a
# native dependency's build script undecided exits 1 with
# ERR_PNPM_IGNORED_BUILDS. Both entries below are decisions, not noise.
allowBuilds:
  # The bundler Astro's toolchain and wrangler drive. Its install script only
  # selects the prebuilt binary for the platform.
  esbuild: true
  # The image library `scripts/brand/` renders the icons with (and Astro's
  # image service would use). Its install script picks up the prebuilt
  # @img/sharp-linux-* binary for the platform rather than compiling libvips.
  sharp: true
  # The Workers runtime `wrangler dev` serves the built static assets in
  # (MOTIR-10643). Its install script only fetches the prebuilt binary.
  workerd: true
# ⚠️ A NARROW, SELF-EXPIRING SUPPLY-CHAIN EXEMPTION — added by MOTIR-1152 and
# RE-POINTED by MOTIR-3848; it is load-bearing TODAY rather than tidy-up. pnpm 11
# rejects a lockfile entry published inside a rolling ~24h `minimumReleaseAge`
# cutoff, and `@motir/brand` is published from motir-core hours before this
# repository can consume it. Without this line `pnpm install --frozen-lockfile`
# fails EVERY job in `ci.yml`:
#
#   [ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION] @motir/brand@0.2.0 was published
#   at 2026-08-29T…Z, within the minimumReleaseAge cutoff
#
# ⚠️ REPLACED, NEVER APPENDED TO. The line the previous entry carried — *"it
# stops matching anything the moment `@motir/brand` is bumped — DELETE IT THEN"*
# — assumed the bump would land a day or more after the publish. It does not:
# the fonts move and the version that ships them are ONE card, so the exemption
# moves with the version rather than being deleted. What that line was really
# protecting is unchanged and still binds: ONE exact version, of ONE package we
# publish ourselves. **A SECOND entry here is a signal to wait a day rather than
# to add a line**, and a package we do not publish never belongs on this list.
#
# `@motir/brand@0.2.0` ships the OG card's font faces, which used to be
# committed twice — once here and once in motir-core. Drop this entry once the
# version is more than a day old and CI has gone green without it, or re-point
# it again on the next bump.
#
# ⚠️ THERE ARE TWO ENTRIES TODAY, AND THE PARAGRAPH ABOVE SAYS A SECOND ONE IS A
# SIGNAL TO WAIT A DAY. Read why this one did not (MOTIR-3872, 2026-08-29), and
# then hold the rule: the `@motir/design-system` entry names the FIRST publish
# carrying a fix motir.co cannot serve without — the pin bump IS the fix and it
# cannot wait out a 24h cutoff. Both entries name ONE exact version of ONE
# package we publish ourselves, which is the condition the rule is actually
# protecting; neither is a third-party package, and the count is a symptom of
# two of our own packages shipping on the same day rather than of the exemption
# widening. **The signal still stands for the NEXT one.**
#
# ⚠️ RE-POINTED 0.1.1 → 0.1.2 by MOTIR-3996 (2026-08-30), NOT APPENDED TO — the
# same correction the `@motir/brand` paragraph above records. `pnpm install`
# APPENDS the new version and leaves the old line standing, so the file grows a
# third entry on its own and the fourth reads as a list. The 0.1.1 line matched
# nothing the moment the pin moved (`grep -c 'design-system@0.1.1' pnpm-lock.yaml`
# → 0), so it was deleted in the same commit. **0.1.2 carries the scoped-palette
# fix (MOTIR-3933): until this repository pins it, `motir.co/design` renders ten
# identical palette tiles.** Published 2026-08-30T20:34:31Z, twelve minutes before
# this install — squarely inside the cutoff, which is why the line is here.
#
# ⚠️ RE-POINTED 0.1.3 → 0.6.0 by MOTIR-6616 (2026-09-27), NOT APPENDED TO, for
# the same reason. **0.6.0 carries MOTIR-6471's palette rename: until this
# repository pins it, every motir.co page opens in the warm scheme under the
# name "motir", a day after the product moved to the monochrome one.**
# Published 2026-09-26T23:02:19Z, about fourteen hours before this install.
#
# ⚠️ RE-POINTED 0.6.0 → 0.8.2 by MOTIR-7588 (2026-10-06), NOT APPENDED TO, for
# the same reason. **0.8.2 carries MOTIR-7582's warm touches in the `motir`
# palette: until this repository pins it, motir.co keeps the all-blue default
# while the product shows the warm orange accent, the citrine Design hue and the
# warmed peach / yellow washes.** Published 2026-10-06T01:57:19Z, about eight
# hours before this install. The 0.6.0 line matched nothing once the pin moved
# (`grep -c 'design-system@0.6.0' pnpm-lock.yaml` → 0), so it was deleted.
#
# ⚠️ AND BOTH ARE OWED A DELETION, WHICH IS WHY THE CONDITION IS WRITTEN AS A
# COMMAND: once each version is more than a day old, run
# `pnpm install --frozen-lockfile` with its line removed — green means delete it.
